<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>High Beta Trends</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0d1117;
    color: #e6edf3;
    font-family: 'Segoe UI', Arial, sans-serif;
    padding: 16px;
  }
  h1 {
    text-align: center;
    font-size: 1.4rem;
    color: #58a6ff;
    margin-bottom: 8px;
    letter-spacing: 1px;
  }
  .sub {
    text-align: center;
    color: #8b949e;
    font-size: 0.8rem;
    margin-bottom: 8px;
  }
  .nav {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 12px;
  }
  .nav a {
    color: #8b949e;
    text-decoration: none;
    padding: 6px 12px;
    border-radius: 8px;
    border: 1px solid #30363d;
    font-size: 0.85rem;
  }
  .nav a.active, .nav a:hover {
    color: #e6edf3;
    border-color: #58a6ff;
    background: #161b22;
  }
  .chips {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-bottom: 14px;
  }
  .chip {
    border: 1px solid #30363d;
    background: #161b22;
    color: #e6edf3;
    border-radius: 999px;
    padding: 6px 12px;
    cursor: pointer;
    font-size: 12px;
  }
  .chip.active { border-color: #58a6ff; color: #58a6ff; }
  .main-chart {
    height: 520px;
    border: 1px solid #21262d;
    border-radius: 10px;
    overflow: hidden;
    background: #161b22;
    margin-bottom: 16px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px;
  }
  .card {
    border: 1px solid #21262d;
    border-radius: 10px;
    overflow: hidden;
    background: #161b22;
    cursor: pointer;
  }
  .card h3 {
    margin: 0;
    padding: 10px 12px 0;
    font-size: 13px;
    font-weight: 650;
  }
  .card p {
    margin: 2px 0 8px;
    padding: 0 12px;
    color: #8b949e;
    font-size: 11px;
  }
  .mini { height: 180px; }
</style>
</head>
<body>
  <h1>High Beta Trends</h1>
  <div class="sub">12 隻觀察名單 · 下面全部 3M 圖一齊睇 · 撞 ticker 先換上面大圖</div>
  <nav class="nav">
    <a href="./index.html">Sectors</a>
    <a class="active" href="./themes.html">High Beta</a>
  </nav>
  <div class="chips" id="chips"></div>
  <div class="main-chart" id="mainChart"></div>
  <div class="grid" id="grid"></div>
<script>
const HIGH_BETA = [
  { ticker: "SMH", theme: "Semis", tv: "NASDAQ:SMH" },
  { ticker: "IGV", theme: "Software", tv: "AMEX:IGV" },
  { ticker: "HACK", theme: "Cyber", tv: "AMEX:HACK" },
  { ticker: "LYTE", theme: "Photonics", tv: "CBOE:LYTE" },
  { ticker: "UFO", theme: "Space", tv: "NASDAQ:UFO" },
  { ticker: "ARKG", theme: "Genomics", tv: "AMEX:ARKG" },
  { ticker: "ARKK", theme: "Innovation", tv: "AMEX:ARKK" },
  { ticker: "SPMO", theme: "S&P Momentum", tv: "AMEX:SPMO" },
  { ticker: "SPGI", theme: "S&P Global", tv: "NYSE:SPGI" },
  { ticker: "COPX", theme: "Copper", tv: "AMEX:COPX" },
  { ticker: "GDXJ", theme: "Junior Gold Miners", tv: "AMEX:GDXJ" },
  { ticker: "JETS", theme: "Airlines", tv: "AMEX:JETS" }
];

let selected = HIGH_BETA[0].tv;

function loadTvScript(src, config, mount) {
  mount.innerHTML = "";
  const wrap = document.createElement("div");
  wrap.className = "tradingview-widget-container";
  wrap.style.height = "100%";
  wrap.style.width = "100%";
  const widget = document.createElement("div");
  widget.className = "tradingview-widget-container__widget";
  widget.style.height = "100%";
  widget.style.width = "100%";
  const script = document.createElement("script");
  script.src = src;
  script.async = true;
  script.text = JSON.stringify(config);
  wrap.appendChild(widget);
  wrap.appendChild(script);
  mount.appendChild(wrap);
}

function renderMain(symbol) {
  selected = symbol;
  document.querySelectorAll(".chip").forEach(el => {
    el.classList.toggle("active", el.dataset.tv === symbol);
  });
  loadTvScript(
    "https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js",
    {
      autosize: true,
      symbol,
      interval: "D",
      timezone: "America/New_York",
      theme: "dark",
      style: "1",
      locale: "en",
      backgroundColor: "#0d1117",
      hide_top_toolbar: false,
      hide_legend: false,
      allow_symbol_change: false,
      calendar: false,
      studies: ["MASimple@tv-basicstudies", "Volume@tv-basicstudies"],
      support_host: "https://www.tradingview.com"
    },
    document.getElementById("mainChart")
  );
}

function render() {
  const chips = document.getElementById("chips");
  const grid = document.getElementById("grid");
  chips.innerHTML = "";
  grid.innerHTML = "";
  HIGH_BETA.forEach((item, i) => {
    const chip = document.createElement("button");
    chip.className = "chip" + (i === 0 ? " active" : "");
    chip.dataset.tv = item.tv;
    chip.textContent = item.ticker + " · " + item.theme;
    chip.onclick = () => renderMain(item.tv);
    chips.appendChild(chip);
    const card = document.createElement("div");
    card.className = "card";
    card.onclick = () => {
      renderMain(item.tv);
      window.scrollTo({ top: 0, behavior: "smooth" });
    };
    card.innerHTML = `<h3>${item.ticker}</h3><p>${item.theme}</p><div class="mini" id="mini-${item.ticker}"></div>`;
    grid.appendChild(card);
    loadTvScript(
      "https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js",
      {
        symbol: item.tv,
        width: "100%",
        height: "180",
        locale: "en",
        dateRange: "3M",
        colorTheme: "dark",
        isTransparent: true,
        autosize: false,
        largeChartUrl: ""
      },
      document.getElementById("mini-" + item.ticker)
    );
  });
  renderMain(selected);
}

render();
</script>
</body>
</html>
